description: Local workbench for text analysis; Google Trends for books.
bullets:
  - Browse and read books, visualize and contrast terms, and jump occurrences across multiple texts.
  - View text statistics and vocabulary for a corpus, text, or selection.
  - Compares texts or selections to find characteristic words.
  - Reads TXT, Markdown, HTML/XHTML, and EPUB entirely in the browser; with demo corpora and a baked 1,000-book Standard Ebooks catalog.
