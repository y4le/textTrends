      88.8889% { transform: scaleX(0.4191); }
      100% { transform: scaleX(0.4438); }
    }

    .tt-still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .tt-motion { display: none; }
      .tt-still { display: inline; }
    }
