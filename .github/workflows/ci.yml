# Typecheck, test, and build every change. Successful builds from master are
# uploaded and deployed through GitHub Pages' artifact-based workflow.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Production build (deployability; typecheck already ran above)
        run: pnpm --filter @texttrends/web build:bundle
      - name: Enforce the production bundle contract (budget, lazy chunks, no facade)
        run: pnpm check:bundle

      # Playwright's web server builds e2e mode into the same dist directory,
      # so capture the verified production bytes before browser tests run.
      # The deploy job still waits for this entire checks job to pass.
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload production build for GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Install Playwright Chromium and WebKit
        run: pnpm --filter @texttrends/web exec playwright install --with-deps chromium webkit

      - name: Real-browser suites (functional, then the serial benchmark)
        run: pnpm e2e

      - name: Upload Playwright report and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
