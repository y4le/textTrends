# CI — Phase 1 Milestone 6 (M6 consult §11): a gate that is never run
# automatically is only a script. Unit + typecheck + BOTH builds (the normal
# production bundle proves deployability and must contain no e2e facade; the
# e2e bundle feeds Playwright), then the real-browser functional suite and
# the serial benchmark project.

name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Production build (deployability; typecheck already ran above)
        run: pnpm --filter @texttrends/web build:bundle
      - name: Enforce the production bundle contract (budget, lazy chunks, no facade)
        run: pnpm check:bundle

      - name: Install Playwright Chromium and WebKit
        run: pnpm --filter @texttrends/web exec playwright install --with-deps chromium webkit

      - name: Real-browser suites (functional, then the serial benchmark)
        run: pnpm e2e

      - name: Upload Playwright report and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
