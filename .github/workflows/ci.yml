# CI — Phase 1 Milestone 6 (M6 consult §11): a gate that is never run
# automatically is only a script. Unit + typecheck + BOTH builds (the normal
# production bundle proves deployability and must contain no e2e facade; the
# e2e bundle feeds Playwright), then the real-browser functional suite and
# the serial benchmark project.

name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Production build (deployability)
        run: pnpm --filter @texttrends/web build
      - name: Assert the e2e facade is absent from the production bundle
        run: |
          if grep -rl "ttE2E\|ttHarness" apps/web/dist/assets/; then
            echo "::error::e2e facade leaked into the production bundle"
            exit 1
          fi
          test ! -f apps/web/dist/e2e-harness.html

      - name: Install Playwright Chromium
        run: pnpm --filter @texttrends/web exec playwright install --with-deps chromium

      - name: Real-browser functional suite
        working-directory: apps/web
        run: pnpm exec playwright test --project=chromium-functional

      - name: Real-browser benchmark project (serial)
        working-directory: apps/web
        run: pnpm exec playwright test --project=chromium-benchmark --workers=1

      - name: Upload Playwright report and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
