# Typecheck, test, and build code changes. Successful builds from master are
# uploaded and deployed through GitHub Pages' artifact-based workflow.

name: ci

on:
  push:
    branches: [master]
    # docs/reference.md is deliberately included: shortcuts.test.ts reads it.
    paths-ignore: &documentation
      - 'docs/design/**'
      - 'docs/development.md'
      - 'docs/explanation.md'
      - 'docs/how-to.md'
      - 'docs/tutorial.md'
      - '**/README.md'
  pull_request:
    paths-ignore: *documentation
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: All unit suites before compiled artifacts exist
        run: pnpm exec vitest run

      - name: Typecheck
        run: pnpm typecheck
      - name: Script tests against compiled package exports
        run: node --test 'scripts/*.test.mjs'

      - name: Production build (deployability; typecheck already ran above)
        run: pnpm --filter @texttrends/web build:bundle
      - name: Enforce the production bundle contract (budget, lazy chunks, no facade)
        run: pnpm check:bundle

      # Publish the exact production bytes that passed the bundle contract.
      # Browser jobs build their own e2e-mode artifacts on isolated runners.
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload production build for GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  browser:
    name: browser / ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium-functional-1-of-2
            project: chromium-functional
            shard: "1/2"
          - name: chromium-functional-2-of-2
            project: chromium-functional
            shard: "2/2"
          - name: webkit-compact-1-of-2
            project: webkit-compact
            shard: "1/2"
          - name: webkit-compact-2-of-2
            project: webkit-compact
            shard: "2/2"
          - name: chromium-benchmark
            # A matrix entry is still a separate runner; timing gates stay isolated.
            project: chromium-benchmark
            shard: "1/1"
    # Keep browser binaries and native libraries out of the runner's mutable
    # apt state. This image is pinned to the lockfile's Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Real-browser suite (${{ matrix.name }})
        # GitHub's needs graph gates deployment; do not rerun Playwright dependencies.
        run: >-
          pnpm --filter @texttrends/web exec playwright test
          --project="${{ matrix.project }}"
          --shard="${{ matrix.shard }}"
          --workers=1
          --no-deps
          --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      # Retried failures are useful diagnostics even when the job succeeds.
      - name: Detect retained failure traces
        id: diagnostics
        if: ${{ !cancelled() }}
        run: |
          if [ -d apps/web/test-results ] &&
             [ -n "$(find apps/web/test-results -name trace.zip -print -quit)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload failure diagnostics or benchmark measurements
        if: ${{ !cancelled() && (failure() || steps.diagnostics.outputs.found == 'true' || matrix.project == 'chromium-benchmark') }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.name }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
